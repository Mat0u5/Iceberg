architectury {
	common {
		clear()
		add(rootProject.enabledPlatforms.split(','))
		//forgeUsesMojangMappings = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/iceberg.accesswidener")
}

dependencies {
	// We depend on Fabric Loader here to use the Fabric @Environment annotations,
	// which get remapped to the correct annotations on each platform.
	// Do NOT use other classes from Fabric Loader.
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabricLoaderVersion"


	modImplementation "curse.maven:geckolib-388172:7705308"

	// EMI does not have versions past 1.21.1, keeping modCompileOnly for now. Consider removing the dependency if the mod has been abandoned.
	modCompileOnly "curse.maven:emi-580555:6075447"

	// Azure does not have versions past 1.21.1, keeping modCompileOnly for now. Consider removing the dependency if the mod has been abandoned.
	modCompileOnly "curse.maven:azurelib-817423:6303718"
	modCompileOnly "curse.maven:azurelib-armor-912767:6378819"
}
